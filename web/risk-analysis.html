<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Analysis - MPLADs</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .risk-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media(max-width: 768px) {
            .risk-grid {
                grid-template-columns: 1fr;
            }
        }
        .risk-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--danger-color);
        }
        .risk-card.medium-risk {
            border-left-color: var(--warning-color);
        }
        .risk-card h3 {
            margin-bottom: 10px;
            color: var(--primary-color);
        }
        .risk-details p {
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .risk-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .badge-high { background-color: #fee2e2; color: #b91c1c; }
        .badge-medium { background-color: #fef3c7; color: #b45309; }
        .chart-placeholder {
            height: 300px;
            background-color: #f8f9fa;
            border: 1px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>MPLADs</h2>
        </div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="risk-analysis.html" class="active">Risk Analysis</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1 class="page-title">Risk Analysis & Alerts</h1>
            <button class="btn btn-primary" id="btn-refresh">Refresh Data</button>
        </header>

        <section class="content-area">
            <div class="chart-placeholder">
                <p>AI Risk Assessment Chart (Mock View)</p>
            </div>
            
            <h2 style="margin-bottom: 20px; color: var(--primary-color);">Flagged Projects</h2>
            
            <div class="risk-grid" id="risk-container">
                <!-- Risks populated by JS -->
            </div>
        </section>
    </main>
    <script src="js/risk-analysis.js"></script>
</body>
</html>
